name: 🔦 Lighthouse
on:
  push:
    branches: [main, alpha, dev]
  workflow_dispatch:

jobs:
  lhci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 6379:6379
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: 12345
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
    steps:
    - name: 💾 Checkout
      uses: actions/checkout@v6

    - name: 🧹 Cleanup apt list
      uses: christopherpickering/no-azure-action@v1.1.0

    - name: 📦 Setup pnpm
      uses: pnpm/action-setup@v6

    - name: ⎔ Setup node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - name: 📥 Download deps
      run: pnpm install --frozen-lockfile

    - name: 🐍 Setup python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: 🪐 Setup uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        enable-cache: true

    - name: 📥 Install
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config python3-dev \
          libssl-dev libffi-dev \
          libxml2-dev libxmlsec1-dev libxmlsec1-openssl1 \
          libldap2-dev libsasl2-dev \
          unixodbc unixodbc-dev libpq-dev
        uv sync --frozen --group dev

    - name: 💽 Start test services
      run: |
        uv run flask cli reset_db
        uv run flask db upgrade
        uv run flask cli seed
        uv run flask cli seed_demo
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        PGPASSWORD: 12345
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        FLASK_ENV: test
        FLASK_DEBUG: false
        FLASK_APP: web
        FLASK_RUN_PORT: 4998

    - name: 🔦 Run Lighthouse
      run: |
        pnpm dlx @lhci/cli@0.9.x autorun
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        PGPASSWORD: 12345
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}
